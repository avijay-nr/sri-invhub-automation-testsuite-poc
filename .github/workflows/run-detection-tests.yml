name: SRI - Investigation Hub Test Flows

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'QA-Dev'
        type: choice
        options:
          - QA-Dev
          - QA-Test
          - Custom

      custom_env_url:
        description: 'Custom Env URL (only if environment = Custom)'
        required: false
        default: ''
        type: string

      email:
        description: 'Enter Login Email'
        required: true
        default: ''
        type: string

      tags:
        description: 'Select test tag'
        required: true
        default: '@smoke'
        type: choice
        options:
          - '@smoke'
          - '@regression'
          - '@admin'
          - 'custom'

      custom_tag:
        description: 'Custom tag (only if tags = custom). e.g. @admin_TC0001'
        required: false
        default: ''
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Health check - verify environment is reachable
        run: |
          if [ "$TEST_ENV" = "Custom" ]; then
            ENV_URL="$CUSTOM_ENV_URL"
          elif [ "$TEST_ENV" = "QA-Dev" ]; then
            ENV_URL="https://ih-sri-dev.symphonyai.dev"
          else
            ENV_URL="https://ih-sri-test.symphonyai.dev"
          fi

          if [ -z "$ENV_URL" ]; then
            echo "❌ No URL found for environment: $TEST_ENV"
            exit 1
          fi

          echo "🔍 Health check: $ENV_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ENV_URL" --max-time 15)

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Environment is UP (HTTP $STATUS)"
          else
            echo "❌ Environment is DOWN or unreachable (HTTP $STATUS)"
            exit 1
          fi
        env:
          TEST_ENV: ${{ github.event.inputs.environment }}
          CUSTOM_ENV_URL: ${{ github.event.inputs.custom_env_url }}

      - name: Resolve OTP Flow URL for user
        run: |
          EMAIL="${{ github.event.inputs.email }}"
          echo "🔍 Looking up OTP Flow URL for: $EMAIL"

          OTP_URL=$(echo '${{ secrets.OTP_FLOW_MAP }}' | jq -r --arg email "$EMAIL" '.[$email] // empty')

          if [ -z "$OTP_URL" ]; then
            echo "❌ ERROR: No OTP Flow URL found for email: $EMAIL"
            echo "💡 Please add your email and Power Automate URL to the OTP_FLOW_MAP secret."
            echo ""
            echo "📋 How to fix:"
            echo "   1. Go to GitHub → Settings → Secrets → OTP_FLOW_MAP"
            echo "   2. Add your entry: \"$EMAIL\":\"your-power-automate-url\""
            echo "   3. Re-run this workflow"
            exit 1
          fi

          echo "✅ OTP Flow URL found for $EMAIL"
          echo "RESOLVED_OTP_URL=$OTP_URL" >> $GITHUB_ENV

      - name: Resolve test tag
        run: |
          if [ "$TAG_SELECT" = "custom" ]; then
            if [ -z "$CUSTOM_TAG" ]; then
              echo "❌ ERROR: 'custom' selected but no custom tag provided!"
              echo "💡 Please enter a value in the 'Custom tag' input field."
              exit 1
            fi
            echo "RESOLVED_TAG=$CUSTOM_TAG" >> $GITHUB_ENV
            echo "✅ Using custom tag: $CUSTOM_TAG"
          else
            echo "RESOLVED_TAG=$TAG_SELECT" >> $GITHUB_ENV
            echo "✅ Using tag: $TAG_SELECT"
          fi
        env:
          TAG_SELECT: ${{ github.event.inputs.tags }}
          CUSTOM_TAG: ${{ github.event.inputs.custom_tag }}

      - name: Run IH tests
        run: |
          if [ -n "$TAGS" ]; then
            npx playwright test --grep "$TAGS" --retries=2 --reporter=html,json
          else
            npx playwright test --retries=2 --reporter=html,json
          fi
        env:
          TEST_USER_EMAIL: ${{ github.event.inputs.email }}
          TEST_ENV: ${{ github.event.inputs.environment }}
          CUSTOM_ENV_URL: ${{ github.event.inputs.custom_env_url }}
          TAGS: ${{ env.RESOLVED_TAG }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          OTP_FETCH_CMD: 'curl -s -X POST "${{ env.RESOLVED_OTP_URL }}" -H "Content-Type: application/json" -d "{\"email\": \"${{ github.event.inputs.email }}\"}"'
          OTP_REGEX: '\d{6}'

      - name: Flaky test report
        if: always()
        run: |
          echo "## 🧪 SRI - IH Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌍 Environment | $TEST_ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| 📧 Email | $TEST_USER_EMAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Tags | ${TAGS:-all tests} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f playwright-report/results.json ]; then
            PASSED=$(jq '.stats.expected // 0' playwright-report/results.json)
            FAILED=$(jq '.stats.unexpected // 0' playwright-report/results.json)
            FLAKY=$(jq '.stats.flaky // 0' playwright-report/results.json)
            SKIPPED=$(jq '.stats.skipped // 0' playwright-report/results.json)
            TOTAL=$(jq '.stats.total // 0' playwright-report/results.json)

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Flaky (passed on retry) | $FLAKY |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No results.json found — report may not have generated." >> $GITHUB_STEP_SUMMARY
          fi
        env:
          TEST_ENV: ${{ github.event.inputs.environment }}
          TEST_USER_EMAIL: ${{ github.event.inputs.email }}
          TAGS: ${{ env.RESOLVED_TAG }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ih-test-report
          path: playwright-report/